name: Build AI Auto Play (Android64)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Auto-Play-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
